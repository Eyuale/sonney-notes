version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sonney-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # MONGODB_URI should be passed from host or .env
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB=${MONGODB_DB}
    depends_on:
      - backend

  backend:
    build:
      context: ./services/y-websocket
      dockerfile: Dockerfile
    container_name: sonney-backend
    restart: always
    ports:
      - "1234:1234"
    environment:
      - PORT=1234
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB=${MONGODB_DB}

# Optional: Add mongodb service if you want it self-contained
